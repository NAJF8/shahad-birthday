<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة | موقع عيد ميلاد شهد عادل 🎀</title>
  <script>
    // If user attempted to navigate to /admin or /admin/
    const path = window.location.pathname.toLowerCase();
    if (path.endsWith('/admin') || path.endsWith('/admin/')) {
      window.location.replace('admin/index.html');
    }
  </script>
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', -apple-system, sans-serif;
      background: radial-gradient(circle at center, #fff0f5 0%, #fff7f9 100%);
      color: #4a1525;
      text-align: center;
      padding: 60px 20px;
      direction: rtl;
    }
    .card {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 28px;
      border: 1px solid #fbcfe8;
      box-shadow: 0 10px 30px rgba(244, 63, 113, 0.12);
    }
    .icon { font-size: 3rem; margin-bottom: 16px; }
    h1 { font-size: 1.8rem; color: #9d174d; margin-bottom: 12px; }
    p { font-size: 1.05rem; color: #831843; margin-bottom: 24px; line-height: 1.7; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #ff7597, #db2777);
      color: #fff;
      text-decoration: none;
      border-radius: 9999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🦢🎀</div>
    <h1>الصفحة غير موجودة</h1>
    <p>يبدو أن الرابط الذي تبحث عنه غير متوفر، دعينا نعود معاً إلى صفحة الاحتفال الرئيسية بشهد عادل.</p>
    <a href="index.html" class="btn">العودة للصفحة الرئيسية</a>
  </div>
</body>
</html>
